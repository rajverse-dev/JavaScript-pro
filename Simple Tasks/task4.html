<style>
    .overlay{
        background-color: black;
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0px;
        left: 0px;
        opacity: 0.8;
        z-index: 1;
        display: none;

    }
    .popupbox{
        position: absolute;
        z-index: 2;
        background-color: aliceblue;
        color: black;
        width: 45%;
        height: 25%;
        left: 35%;
        border-radius: 10px;
        padding: 25px;
        display: none;

    }
</style>
<button onclick="show()">show</button>
<div class="overlay"></div>
<div class="popupbox">
    <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Reiciendis, dolorum ullam consequatur at assumenda delectus necessitatibus omnis cum, corrupti impedit consequuntur nemo! Nostrum praesentium inventore perferendis reprehenderit temporibus velit quisquam.</p>
    <button onclick="closee()">Close</button>
</div>
<script>
    var popupoverlay=document.querySelector(".overlay")
    var popupbox=document.querySelector(".popupbox")
    function show(){
        popupbox.style.display="block"
        popupoverlay.style.display="block"
        alert("files are showcase...")
    }
    function closee(){
        popupbox.style.display="none"
        popupoverlay.style.display="none"
        alert("Files are closed....")
    }


</script>

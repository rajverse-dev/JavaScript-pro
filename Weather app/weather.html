<html>
    <head>
        <title>Weather App</title>
        <style>
            body{
                font-family: Arial;
                padding: 20px;
            }
            input,button{
                padding: 5px;
            }
        </style>
    </head>

    <body>
        <h1>Weather App</h1>

        <input type="text" id="city" placeholder="Enter City Name">
        <button onclick="getWeather()">Get Weather</button>

        <p id="result"></p>

        <script>
            async function getWeather() {
                var city=document.getElementById('city').value
                var result=document.getElementById("result")

                if (city===""){
                    result.innerText="Please Enter a city name"
                    return
                }

                try{
                    var response=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=13.08&longitude=80.27&current_weather=true`)
                     var data=await response.json()

                     result.innerText=`Temperature: ${data.current_weather.temperature}°C`

                }
                catch(error){
                    result.innerText="Error fetching weather data"
                }
                


                
            }
        </script>
    </body>
</html>

<body>
    <div class="container">
        <h1>Age Calculator</h1>
        <div class="form">
            <label>Enter your date of birth</label><br><br>
            <input type="date" id="birthday">
            <br><br>
            <button onclick="calculateAge()">Calculate Age</button>
            <p id="result">Your age is :</p>
        </div>
    </div>
</body>

<script>
    var birthdayel = document.getElementById("birthday")
    var resultel = document.getElementById("result")

    function calculateAge() {
        var birthdayValue = birthdayel.value

        if (birthdayValue === '') {
            alert("Please enter your birthday")
            return
        }

        var age = getAge(birthdayValue)

        resultel.innerText =
            `Your age is ${age.years} year(s) ${age.months} month(s) ${age.days} day(s)`
    }

    function getAge(birthdayValue) {
        var today = new Date()
        var birthdate = new Date(birthdayValue)

        if (isNaN(birthdate.getTime())) {
            return { years: 0, months: 0, days: 0 }
        }

        var years = today.getFullYear() - birthdate.getFullYear()
        var months = today.getMonth() - birthdate.getMonth()
        var days = today.getDate() - birthdate.getDate()

        // Fix days
        if (days < 0) {
            months--
            var lastMonth = new Date(today.getFullYear(), today.getMonth(), 0)
            days += lastMonth.getDate()
        }

        // Fix months
        if (months < 0) {
            years--
            months += 12
        }

        return {
            years: years,
            months: months,
            days: days
        }
    }
</script>
